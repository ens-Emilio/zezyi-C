<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>zezyi — falling blocks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: monospace;
      overflow: hidden;
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ---- Canvas area ---------------------------------------------------- */
    #canvas-wrap {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* NOTE: Emscripten sets canvas.style.width/height inline after init.
       fitCanvas() in JS overrides those values — do NOT set max-width/height
       here as they won't win against inline styles. */
    #canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    /* ---- Audio unlock overlay ------------------------------------------- */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    #overlay h1 {
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      letter-spacing: 0.2em;
      color: #ffe066;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    #overlay p {
      font-size: clamp(0.85rem, 3vw, 1rem);
      color: #aaa;
      margin-bottom: 2rem;
    }

    #overlay .btn {
      background: #ffe066;
      color: #111;
      border: none;
      padding: 0.75rem 2.5rem;
      font-family: monospace;
      font-size: clamp(0.9rem, 3.5vw, 1.1rem);
      font-weight: bold;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      touch-action: manipulation;
    }
    #overlay .btn:active { background: #ffd700; }

    /* ---- Loading indicator ---------------------------------------------- */
    #status {
      position: fixed;
      bottom: 1rem;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: #555;
      pointer-events: none;
      z-index: 5;
    }

    #progress {
      display: none;
      width: 200px; height: 4px;
      background: #222;
      border-radius: 2px;
      margin: 0.4rem auto 0;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%; width: 0%;
      background: #ffe066;
      transition: width 0.15s ease;
    }

    /* ---- Virtual gamepad ----------------------------------------------- */
    #controls {
      flex-shrink: 0;
      display: none;
      flex-direction: column;
      gap: 6px;
      background: #0d0d14;
      border-top: 1px solid #1e1e2e;
      padding: 8px 8px env(safe-area-inset-bottom, 6px);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .ctrl-row {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 5px;
    }

    /* Base button */
    .btn-ctrl {
      flex: 1;
      min-width: 44px;
      height: 50px;
      background: rgba(255,255,255,0.07);
      color: #ccc;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      font-family: monospace;
      font-weight: bold;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.04s, transform 0.04s;
    }

    .btn-ctrl.pressed,
    .btn-ctrl:active {
      background: rgba(80, 80, 180, 0.55);
      border-color: #ffe066;
      color: #ffe066;
      transform: scale(0.92);
    }

    /* Aux row (HOLD / PAUSE) — shorter height */
    .ctrl-row.row-aux .btn-ctrl {
      height: 34px;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Accent tints */
    .btn-ccw  { border-color: rgba(100,100,200,0.5); }
    .btn-cw   { border-color: rgba(100,100,200,0.5); }
    .btn-hold { border-color: rgba(40,120,120,0.5); color: #7ee8e8; }
    .btn-pause{ border-color: rgba(120,100,20,0.5); color: #ffe066; }
    .btn-drop { font-size: 1rem; }

    /* Landscape mobile: controls move to the right side */
    @media (orientation: landscape) and (max-height: 480px) {
      body { flex-direction: row; }

      #canvas-wrap { height: 100dvh; }

      #controls {
        flex-direction: column;
        width: 150px;
        height: 100dvh;
        border-top: none;
        border-left: 1px solid #1e1e2e;
        padding: 8px 6px;
        gap: 5px;
        justify-content: center;
      }

      .ctrl-row { flex-direction: column; gap: 5px; }
      .ctrl-row.row-aux { flex-direction: row; }
      .ctrl-row.row-main { flex-direction: row; flex-wrap: wrap; }

      .btn-ctrl         { height: 44px; font-size: 1.1rem; }
      .ctrl-row.row-aux .btn-ctrl { height: 32px; }
    }
  </style>
</head>
<body>

<!-- Audio unlock overlay -->
<div id="overlay">
  <h1>zezyi</h1>
  <p>tap to start</p>
  <button class="btn" id="start-btn">Play</button>
</div>

<div id="canvas-wrap">
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
</div>

<!-- Virtual gamepad — hidden until first touch -->
<div id="controls">
  <div class="ctrl-row row-aux">
    <button class="btn-ctrl btn-hold"  data-key="c"  data-code="KeyC"       data-kc="67">HOLD</button>
    <button class="btn-ctrl btn-pause" data-key="p"  data-code="KeyP"       data-kc="80">PAUSE</button>
  </div>
  <div class="ctrl-row row-main">
    <button class="btn-ctrl btn-ccw"  data-key="z"           data-code="KeyZ"       data-kc="90">Z</button>
    <button class="btn-ctrl"          data-key="ArrowLeft"   data-code="ArrowLeft"  data-kc="37">←</button>
    <button class="btn-ctrl"          data-key="ArrowDown"   data-code="ArrowDown"  data-kc="40">↓</button>
    <button class="btn-ctrl"          data-key="ArrowRight"  data-code="ArrowRight" data-kc="39">→</button>
    <button class="btn-ctrl btn-cw"   data-key="x"           data-code="KeyX"       data-kc="88">X</button>
    <button class="btn-ctrl btn-drop" data-key=" "           data-code="Space"      data-kc="32">▼▼</button>
  </div>
</div>

<div id="status">
  <span id="status-text">Loading…</span>
  <div id="progress"><div id="progress-bar"></div></div>
</div>

<script>
// ---------------------------------------------------------------------------
// Canvas scaling
// ---------------------------------------------------------------------------
// Emscripten calls canvas.style.width = X + 'px' after SDL_CreateWindow and
// SDL_SetWindowSize, which overrides any CSS max-width/max-height.
// We observe those mutations and immediately replace them with values that
// fill the available viewport while preserving the logical aspect ratio.

var canvas   = document.getElementById('canvas');
var ctrlEl   = document.getElementById('controls');
var _fitting = false;   // re-entrancy guard

function fitCanvas() {
  var lw = canvas.width;
  var lh = canvas.height;
  if (!lw || !lh) return;

  // Available space depends on orientation and whether controls are visible
  var isLandMobile = window.matchMedia(
      '(orientation: landscape) and (max-height: 480px)').matches;

  var ctrlW = (isTouchDevice && isLandMobile)  ? ctrlEl.offsetWidth  : 0;
  var ctrlH = (isTouchDevice && !isLandMobile) ? ctrlEl.offsetHeight : 0;

  var availW = window.innerWidth  - ctrlW;
  var availH = window.innerHeight - ctrlH;

  var ratio = lw / lh;
  var cssW, cssH;
  if (availW / availH < ratio) {
    cssW = availW;
    cssH = availW / ratio;
  } else {
    cssH = availH;
    cssW = availH * ratio;
  }

  _fitting = true;
  canvas.style.width  = Math.floor(cssW) + 'px';
  canvas.style.height = Math.floor(cssH) + 'px';
  _fitting = false;
}

// Watch for Emscripten resetting canvas inline styles (SDL_SetWindowSize etc.)
new MutationObserver(function() {
  if (!_fitting) fitCanvas();
}).observe(canvas, { attributes: true, attributeFilter: ['style', 'width', 'height'] });

window.addEventListener('resize', fitCanvas);

// ---------------------------------------------------------------------------
// Touch detection + show controls
// ---------------------------------------------------------------------------
var isTouchDevice = false;

function showControls() {
  if (isTouchDevice) return;
  isTouchDevice = true;
  ctrlEl.style.display = 'flex';
  // Re-fit after layout reflow so ctrlEl.offsetHeight is correct
  requestAnimationFrame(fitCanvas);
}

window.addEventListener('touchstart', showControls, { once: true, passive: true });

// ---------------------------------------------------------------------------
// Audio unlock
// ---------------------------------------------------------------------------
var overlay  = document.getElementById('overlay');
var startBtn = document.getElementById('start-btn');

function unlockAudio() {
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) { var ac = new Ctx(); ac.resume().catch(function(){}); ac.close(); }
  } catch(e) {}
  overlay.style.display = 'none';
  if (window.Module && Module.resumeMainLoop) Module.resumeMainLoop();
}

overlay.addEventListener('click', unlockAudio);
startBtn.addEventListener('click', function(e) { e.stopPropagation(); unlockAudio(); });

// ---------------------------------------------------------------------------
// Virtual gamepad — touch → keyboard events dispatched on document
// (Emscripten SDL2 registers keyboard handlers on document, not canvas)
// ---------------------------------------------------------------------------
function fireKey(down, key, code, kc) {
  document.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', {
    key: key, code: code, keyCode: kc, which: kc,
    bubbles: true, cancelable: true
  }));
}

// Map: button element → Set of active touch identifiers
var btnTouches = new Map();

function btnPress(el, tid) {
  if (!btnTouches.has(el)) btnTouches.set(el, new Set());
  var ids = btnTouches.get(el);
  if (ids.size === 0) {
    el.classList.add('pressed');
    fireKey(true, el.dataset.key, el.dataset.code, +el.dataset.kc);
  }
  ids.add(tid);
}

function btnRelease(el, tid) {
  if (!btnTouches.has(el)) return;
  var ids = btnTouches.get(el);
  ids.delete(tid);
  if (ids.size === 0) {
    el.classList.remove('pressed');
    fireKey(false, el.dataset.key, el.dataset.code, +el.dataset.kc);
  }
}

function targetBtn(x, y) {
  var el = document.elementFromPoint(x, y);
  return (el && el.classList.contains('btn-ctrl')) ? el : null;
}

ctrlEl.addEventListener('touchstart', function(e) {
  e.preventDefault();
  showControls();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    var b = targetBtn(t.clientX, t.clientY);
    if (b) btnPress(b, t.identifier);
  }
}, { passive: false });

ctrlEl.addEventListener('touchmove', function(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t   = e.changedTouches[i];
    var tid = t.identifier;
    var nb  = targetBtn(t.clientX, t.clientY);
    // Release any button this touch was previously on
    btnTouches.forEach(function(ids, btn) {
      if (ids.has(tid) && btn !== nb) btnRelease(btn, tid);
    });
    if (nb) btnPress(nb, tid);
  }
}, { passive: false });

function releaseChangedTouches(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var tid = e.changedTouches[i].identifier;
    btnTouches.forEach(function(ids, btn) {
      if (ids.has(tid)) btnRelease(btn, tid);
    });
  }
}

ctrlEl.addEventListener('touchend',    releaseChangedTouches, { passive: false });
ctrlEl.addEventListener('touchcancel', releaseChangedTouches, { passive: false });
ctrlEl.addEventListener('contextmenu', function(e) { e.preventDefault(); });

// ---------------------------------------------------------------------------
// Emscripten Module
// ---------------------------------------------------------------------------
var Module = {
  canvas: canvas,

  onRuntimeInitialized: function() {
    // After SDL sets the canvas dimensions, fit it to the viewport
    fitCanvas();
  },

  setStatus: function(text) {
    var el = document.getElementById('status-text');
    var pg = document.getElementById('progress');
    if (!text) { el.textContent = ''; pg.style.display = 'none'; return; }
    el.textContent = text;
    var m = text.match(/(\d+(\.\d+)?)\/(\d+)/);
    if (m) {
      pg.style.display = 'block';
      document.getElementById('progress-bar').style.width =
        (parseFloat(m[1]) / parseFloat(m[3]) * 100) + '%';
    }
  },

  monitorRunDependencies: function(left) {
    if (left === 0) Module.setStatus('');
  },

  print:    function(text) { console.log(text); },
  printErr: function(text) { console.error(text); },
};

canvas.addEventListener('webglcontextlost', function(e) {
  alert('WebGL context lost. Reload the page.');
  e.preventDefault();
}, false);

window.onerror = function(msg) { Module.setStatus('Error: ' + msg); };
</script>

{{{ SCRIPT }}}

</body>
</html>
