<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zezyi — falling blocks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* Scale canvas to fit viewport while preserving aspect ratio */
      max-width: 100vw;
      max-height: 100vh;
    }

    /* ---- Audio unlock overlay ---------------------------------------- */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: pointer;
      user-select: none;
    }

    #overlay h1 {
      font-size: 2.4rem;
      letter-spacing: 0.2em;
      color: #ffe066;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }

    #overlay p {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 2.5rem;
    }

    #overlay .btn {
      background: #ffe066;
      color: #111;
      border: none;
      padding: 0.75rem 2.5rem;
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
    }

    #overlay .btn:hover { background: #ffd700; }

    /* ---- Loading indicator ------------------------------------------- */
    #status {
      position: fixed;
      bottom: 1rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: #555;
      pointer-events: none;
      z-index: 5;
    }

    #progress {
      display: none;
      width: 200px;
      height: 4px;
      background: #222;
      border-radius: 2px;
      margin: 0.4rem auto 0;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: #ffe066;
      transition: width 0.15s ease;
    }
  </style>
</head>
<body>

<!-- Audio unlock overlay — browser requires a user gesture before audio plays -->
<div id="overlay">
  <h1>zezyi</h1>
  <p>click to start</p>
  <button class="btn" id="start-btn">Play</button>
</div>

<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

<div id="status">
  <span id="status-text">Loading…</span>
  <div id="progress"><div id="progress-bar"></div></div>
</div>

<script>
  // ---- Audio unlock -------------------------------------------------
  var overlay   = document.getElementById('overlay');
  var startBtn  = document.getElementById('start-btn');
  var audioReady = false;

  function unlockAudio() {
    // Create and immediately resume the AudioContext if it was suspended.
    // SDL_mixer on Emscripten uses the global AudioContext.
    try {
      var ctx = window.AudioContext || window.webkitAudioContext;
      if (ctx) {
        var ac = new ctx();
        ac.resume().catch(function(){});
        ac.close();
      }
    } catch(e) {}
    audioReady = true;
    overlay.style.display = 'none';
    // Notify Emscripten that we want to resume BGM (SDL may have started it
    // before the gesture — calling resume() here helps browsers that block
    // auto-play).
    if (window.Module && Module.resumeMainLoop) {
      Module.resumeMainLoop();
    }
  }

  overlay.addEventListener('click', unlockAudio);
  startBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    unlockAudio();
  });

  // ---- Emscripten Module configuration ------------------------------
  var Module = {
    canvas: (function() {
      var canvas = document.getElementById('canvas');
      // Disable right-click context menu on canvas
      canvas.addEventListener('webglcontextlost', function(e) {
        alert('WebGL context lost. Reload the page.');
        e.preventDefault();
      }, false);
      return canvas;
    })(),

    // Show loading progress
    setStatus: function(text) {
      var el = document.getElementById('status-text');
      var pg = document.getElementById('progress');
      if (!text) {
        el.textContent = '';
        pg.style.display = 'none';
        return;
      }
      el.textContent = text;
      var m = text.match(/(\d+(\.\d+)?)\/(\d+)/);
      if (m) {
        var pct = (parseFloat(m[1]) / parseFloat(m[3])) * 100;
        pg.style.display = 'block';
        document.getElementById('progress-bar').style.width = pct + '%';
      }
    },

    monitorRunDependencies: function(left) {
      if (left === 0) {
        Module.setStatus('');
      }
    },

    // Pause the main loop until the user clicks (audio unlock).
    // The game renders a static frame on first load; gameplay starts when
    // the overlay is dismissed.
    onRuntimeInitialized: function() {
      // Keep the main loop running (it will render menus fine without audio).
      // Audio will auto-unlock once the user clicks the overlay.
    },

    print: function(text) { console.log(text); },
    printErr: function(text) { console.error(text); },
  };

  // Catch unhandled errors from Emscripten
  window.onerror = function(msg, url, line, col, err) {
    Module.setStatus('Error: ' + msg);
  };
</script>

{{{ SCRIPT }}}

</body>
</html>
